<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Losovačka</title>
<style>
  :root {
    --bg: #e9ecf1;
    --panel: #f6f7fa;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #bcc2cd;
    --accent: #0d6efd;
    --accent-text: #ffffff;
    --danger: #e5566b;
    --chip-border: #6aa0f5;
    --chip-text: #2563c9;
    --shadow: 0 10px 40px rgba(0, 0, 0, .15);
    --drawer-bg: #dde1e8;
    --table-bg: var(--panel);
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --panel: #1e222b;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --border: #3a4050;
    --accent: #4c8dff;
    --accent-text: #ffffff;
    --danger: #e0556a;
    --chip-border: #4a6fb0;
    --chip-text: #8db4ff;
    --shadow: 0 10px 40px rgba(0, 0, 0, .6);
    --drawer-bg: var(--bg);
    --table-bg: var(--panel);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background .25s, color .25s;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; gap: 12px;
  }
  header h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 500; }
  .icon-btn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-size: .95rem; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 28px;
    max-width: 1200px; margin: 0 auto; padding: 8px 20px 40px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  /* wheel */
  .wheel-wrap {
    position: relative; width: 100%; max-width: 640px; margin: 0 auto;
    aspect-ratio: 1 / 1;
  }
  #wheel { width: 100%; height: 100%; display: block; cursor: pointer; border-radius: 50%; box-shadow: var(--shadow); }
  .pointer {
    position: absolute; right: -14px; top: 50%; transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    border-right: 34px solid #e11d2e;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));
    pointer-events: none;
  }
  .hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 22, 27, .7); color: #fff;
    padding: 12px 20px; border-radius: 10px; font-size: clamp(.95rem, 2.4vw, 1.4rem);
    pointer-events: none; white-space: nowrap;
    transition: opacity .3s;
  }
  .hub.hidden { opacity: 0; }

  /* side panel */
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    border: 0; border-radius: 6px; cursor: pointer; font-size: 1rem;
    padding: 10px 22px; color: #fff;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); font-size: 1.15rem; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger { background: var(--danger); padding: 6px 12px; font-size: .8rem; }
  .btn-ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 5px 14px; font-size: .85rem;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  textarea {
    width: 100%; height: 300px; resize: vertical;
    background: var(--panel); color: var(--text);
    border: 2px solid var(--border); border-radius: 4px;
    padding: 10px; font: inherit; line-height: 1.45;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .count { color: var(--muted); font-size: .85rem; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; width: 100%; }

  /* výsuvný panel s historií */
  :root { --drawer-w: min(380px, 92vw); --tab-w: 36px; }
  body { padding-right: var(--tab-w); transition: background .25s, color .25s, padding-right .35s ease; }
  body.history-open { padding-right: calc(var(--drawer-w) + var(--tab-w)); }
  @media (max-width: 1200px) {
    /* na užších obrazovkách panel překrývá obsah, nic se neposouvá */
    body.history-open { padding-right: var(--tab-w); }
  }
  .history-tab {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 31;
    width: var(--tab-w); padding: 18px 0;
    writing-mode: vertical-rl; text-align: center; white-space: nowrap;
    background: var(--panel); color: var(--text); font: inherit; font-size: .95rem;
    border: 1px solid var(--border); border-right: 0; border-radius: 10px 0 0 10px;
    cursor: pointer; box-shadow: var(--shadow);
    transition: right .35s ease, border-color .2s;
  }
  .history-tab:hover { border-color: var(--accent); }
  body.history-open .history-tab { right: var(--drawer-w); }
  .history-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
    width: var(--drawer-w);
    display: flex; flex-direction: column; gap: 10px; padding: 16px;
    background: var(--drawer-bg); border-left: 1px solid var(--border); box-shadow: var(--shadow);
    transform: translateX(100%); visibility: hidden;
    transition: transform .35s ease, visibility 0s .35s;
  }
  body.history-open .history-drawer {
    transform: none; visibility: visible;
    transition: transform .35s ease, visibility 0s;
  }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; }
  .drawer-head h3 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text); }
  .history { font-size: .85rem; color: var(--muted); }
  .history-empty { margin: 8px 0; }
  .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .switch {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px 6px 8px; font-size: .95rem; color: var(--text);
  }
  .switch:hover { border-color: var(--accent); }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: relative; width: 36px; height: 20px; border-radius: 999px;
    background: var(--border); transition: background .2s;
  }
  .switch .thumb {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .thumb { transform: translateX(16px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); cursor: pointer; user-select: none; }
  .opt input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .history-scroll {
    flex: 1; min-height: 0; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--table-bg);
  }
  .history table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .history th, .history td { padding: 6px 10px; text-align: left; vertical-align: baseline; }
  .history thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--table-bg); color: var(--text); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .history tbody tr + tr td { border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
  .history .what { overflow-wrap: anywhere; color: var(--text); }
  .th-sort {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: 0; padding: 0; margin: 0;
    color: inherit; font: inherit; cursor: pointer; white-space: nowrap;
  }
  .th-sort:hover, .th-sort:focus-visible { color: var(--accent); outline: none; }
  .th-sort .arrow { font-size: .7rem; }
  .history .num { width: 1%; text-align: right; white-space: nowrap; }
  .history .when { width: 1%; white-space: nowrap; font-size: .8rem; }

  /* přepínač kolo / ruleta */
  .seg {
    display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
    overflow: hidden; background: var(--panel);
  }
  .seg-btn {
    background: none; border: 0; color: var(--text); font: inherit; font-size: .95rem;
    padding: 7px 14px; cursor: pointer; transition: background .2s, color .2s;
  }
  .seg-btn:hover { color: var(--accent); }
  .seg-btn.active, .seg-btn.active:hover { background: var(--accent); color: var(--accent-text); }

  .preset-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .preset-tabs .seg-btn {
    font-size: .8rem; padding: 3px 10px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--panel);
  }
  .preset-tabs .seg-btn.active, .preset-tabs .seg-btn.active:hover {
    background: var(--accent); border-color: var(--accent); color: var(--accent-text);
  }
  .preset-tabs .seg-btn:disabled { opacity: .4; cursor: not-allowed; }
  .preset-tabs .seg-btn:disabled:hover { color: var(--text); }
  .preset-tabs .seg-action { padding: 3px 9px; }
  .preset-name {
    font: inherit; font-size: .8rem; width: 9.5em; padding: 3px 10px;
    border: 1px solid var(--accent); border-radius: 999px;
    background: var(--panel); color: var(--text); outline: none;
  }

  /* přechod kolo ↔ ruleta */
  .wheel-wrap { perspective: 1400px; }
  .wheel-face, .roulette-face, .cards-face { position: absolute; inset: 0; }
  .cards-face { perspective: 1200px; }
  .roulette-face, .cards-face {
    cursor: pointer;
    transform: rotateY(-90deg) scale(.4); visibility: hidden; pointer-events: none;
    transition: transform .7s cubic-bezier(.5, 0, .2, 1), visibility 0s .7s;
  }
  .wheel-wrap.mode-roulette .roulette-face,
  .wheel-wrap.mode-cards .cards-face {
    transform: none; visibility: visible; pointer-events: auto;
    transition: transform .7s cubic-bezier(.5, 0, .2, 1) .15s, visibility 0s;
  }
  #roulette { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: var(--shadow); }
  .wheel-face {
    transition: transform .7s cubic-bezier(.5, 0, .2, 1) .15s, visibility 0s;
  }
  .wheel-wrap.mode-roulette .wheel-face,
  .wheel-wrap.mode-cards .wheel-face {
    transform: rotateY(90deg) scale(.5); visibility: hidden; pointer-events: none;
    transition: transform .7s cubic-bezier(.5, 0, .2, 1), visibility 0s .7s;
  }
  .stage-caption {
    position: absolute; left: 0; right: 0; bottom: 2%; text-align: center;
    color: var(--muted); font-size: 1.05rem; pointer-events: none;
    opacity: 0; transition: opacity .4s;
  }
  .wheel-wrap.mode-roulette .stage-caption,
  .wheel-wrap.mode-cards .stage-caption { opacity: 1; transition-delay: .6s; }

  /* karty */
  #deckBox { position: absolute; inset: 0; }
  .card {
    position: absolute; left: 50%; top: 50%;
    width: var(--cw, 160px); aspect-ratio: 5 / 7;
    transform-style: preserve-3d; will-change: transform;
  }
  .card-face {
    position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35); border: 1px solid rgba(0, 0, 0, .3);
    display: flex; align-items: center; justify-content: center;
  }
  .card-back {
    background: repeating-linear-gradient(45deg, #1d4ed8 0 8px, #2f6bf0 8px 16px);
    border: calc(var(--cw, 160px) * .05) solid #fff;
    color: #fff; font-size: calc(var(--cw, 160px) * .4); font-weight: 700;
  }
  .card-front {
    background: #fffdf7; color: #1b1b1f; transform: rotateY(180deg);
    padding: 12% 10%; text-align: center; font-weight: 700;
    font-size: calc(var(--cw, 160px) * .12);
  }
  .card-text {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; line-clamp: 6;
    overflow: hidden; overflow-wrap: anywhere; line-height: 1.2;
  }
  .card-front .corner {
    position: absolute; color: #c41e3a; font-size: calc(var(--cw, 160px) * .13); line-height: 1;
  }
  .card-front .tl { top: 5%; left: 7%; }
  .card-front .br { bottom: 5%; right: 7%; transform: rotate(180deg); }

  /* modal */
  dialog {
    border: 0; border-radius: 14px; padding: 0;
    background: var(--panel); color: var(--text);
    box-shadow: var(--shadow); width: min(92vw, 440px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .55); backdrop-filter: blur(2px); }
  dialog[open] { animation: pop .3s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-body { padding: 28px 24px 12px; text-align: center; }
  .modal-body small { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .modal-result {
    margin: 10px 0 0; font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 700;
    word-break: break-word; padding: 14px; border-radius: 10px;
    border-left: 10px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .modal-actions { display: flex; gap: 10px; justify-content: center; padding: 16px 24px 24px; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <h1>Losovačka</h1>
  <div class="header-actions">
    <div class="seg" role="group" aria-label="Typ losování">
      <button id="modeWheel" class="seg-btn active" type="button" aria-pressed="true" title="Klasické kolo štěstí">🎡 Kolo</button>
      <button id="modeRoulette" class="seg-btn" type="button" aria-pressed="false" title="Ruleta při pohledu shora: kulička obíhá a zapadne do vylosované přihrádky">🎰 Ruleta</button>
      <button id="modeCards" class="seg-btn" type="button" aria-pressed="false" title="Tahání karet: balíček se zamíchá a vytáhne se jedna karta">🃏 Karty</button>
    </div>
    <label class="switch" title="Zapnout/vypnout animaci točení kola">
      <input id="animate" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
      <span class="switch-label">Animace</span>
    </label>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Přepnout světlý/tmavý režim" title="Přepne mezi světlým a tmavým režimem">🌙 Tmavý režim</button>
  </div>
</header>

<main>
  <section class="wheel-wrap" id="stage">
    <div class="wheel-face" id="wheelFace">
    <canvas id="wheel" width="800" height="800" aria-label="Kolo štěstí" title="Kliknutím roztočíš kolo"></canvas>
    <div class="pointer"></div>
    <div class="hub" id="hub">kliknutím to roztočíš</div>
    </div>

    <div class="roulette-face" id="rouletteFace" title="Kliknutím vypustíš kuličku">
      <canvas id="roulette" width="800" height="800" aria-label="Ruleta"></canvas>
    </div>
    <div class="cards-face" id="cardsFace" title="Kliknutím zamícháš balíček a vytáhneš kartu">
      <div id="deckBox"></div>
    </div>
    <div class="stage-caption" id="caption">kliknutím vypustíš kuličku</div>
  </section>

  <aside class="panel">
    <div class="actions">
      <button id="spinBtn" class="btn btn-primary" type="button" title="Roztočí kolo a vybere náhodnou položku (jsou potřeba aspoň 2)">Spustit</button>
      <button id="resetBtn" class="btn btn-danger" type="button" title="Vrátí kolo do výchozí polohy a smaže historii výsledků, položky zůstanou (před resetem se zeptá)">Resetovat</button>
    </div>

    <div class="preset-tabs" id="presetTabs" role="group" aria-label="Výběr seznamu"></div>

    <textarea id="items" spellcheck="false" aria-label="Položky kola, jedna na řádek"></textarea>
    <div class="row">
      <button id="clearBtn" class="btn btn-ghost" type="button" title="Smaže všechny položky z kola (před smazáním se zeptá)">Vymazat</button>
      <span class="count" id="count"></span>    </div>

    <div class="row">
      <button id="importBtn" class="btn btn-ghost" type="button" title="Načte položky z .txt souboru (jeden řádek = jedna položka) a nahradí aktuální seznam">⬆ Import .txt</button>
      <button id="exportBtn" class="btn btn-ghost" type="button" title="Uloží aktuální položky do .txt souboru (jeden řádek = jedna položka)">⬇ Export .txt</button>
    </div>
    <input id="importFile" type="file" accept=".txt,text/plain" hidden>

    <label class="opt" title="Když je zapnuto, ve výsledku se ukáže tlačítko, které vybranou položku odebere z kola">
      <input id="allowRemove" type="checkbox">
      Nabízet „Odebrat z kola“ ve výsledku
    </label>

  </aside>
</main>

<button id="historyTab" class="history-tab" type="button" aria-expanded="false" aria-controls="history"
        title="Zobrazí nebo skryje historii točení">Zobrazit historii</button>

<aside class="history-drawer history" id="history" aria-label="Historie točení">
  <div class="drawer-head">
    <h3>Historie točení</h3>
    <button id="historyClose" class="btn btn-ghost" type="button" title="Skrýt historii">✕</button>
  </div>
  <p class="history-empty" id="historyEmpty">Zatím žádné točení.</p>
  <div class="history-scroll" id="historyScroll" hidden>
    <table>
      <thead>
        <tr><th>Výsledek</th><th class="when"><button class="th-sort" type="button" title="Změnit řazení podle data">Datum a čas <span class="arrow" aria-hidden="true">▼</span></button></th>
          <th class="num"><button class="th-sort" type="button" title="Změnit řazení podle data"># <span class="arrow" aria-hidden="true">▼</span></button></th></tr>
      </thead>
      <tbody id="historyList"></tbody>
    </table>
  </div>
</aside>

<dialog id="modal">
  <div class="modal-body">
    <small>Vybráno</small>
    <p class="modal-result" id="modalResult"></p>
  </div>
  <div class="modal-actions">
    <button id="modalRemove" class="btn btn-ghost" type="button" title="Odebere vybranou položku ze seznamu, aby se už nemohla vylosovat znovu">Odebrat z kola</button>
    <button id="modalClose" class="btn btn-primary" type="button" autofocus>Zavřít</button>
  </div>
</dialog>

<dialog id="confirmModal">
  <div class="modal-body">
    <small>Potvrzení</small>
    <p class="modal-result" id="confirmText"></p>
  </div>
  <div class="modal-actions">
    <button id="confirmNo" class="btn btn-ghost" type="button">Zrušit</button>
    <button id="confirmYes" class="btn btn-danger" type="button">Vymazat</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'kolo-stesti:v1';
  const HISTORY_LIMIT = 100;
  const MAX_PRESETS = 10;

  const $ = (id) => document.getElementById(id);
  const canvas = $('wheel'), ctx = canvas.getContext('2d');
  const textarea = $('items'), hub = $('hub'), spinBtn = $('spinBtn');
  const modal = $('modal');

  const state = {
    items: [],          // položky aktivního výběru
    presets: [[]],           // uložené seznamy Výběr 1–N (výchozí je jeden)
    active: 0,               // index aktivního výběru
    names: [''],             // vlastní názvy výběrů ('' = výchozí „Výběr N“)
    theme: null,
    rotation: 0,       // rad
    spinning: false,
    history: [],
    allowRemove: false,
    animate: true,
    historyAsc: false,  // false = nejnovější nahoře
    mode: 'wheel'       // 'wheel' | 'roulette'
  };

  /* ---------- localStorage ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (Array.isArray(d.presets)) {
        state.presets = d.presets.slice(0, MAX_PRESETS)
          .map((p) => (Array.isArray(p) ? p.map(String) : []));
        if (state.presets.length === 0) state.presets = [[]];
        state.names = state.presets.map((_, i) =>
          (Array.isArray(d.presetNames) && typeof d.presetNames[i] === 'string'
            ? d.presetNames[i].slice(0, 20) : ''));
        const a = Number(d.activePreset);
        state.active = Number.isInteger(a) && a >= 0 && a < state.presets.length ? a : 0;
        state.items = state.presets[state.active].slice();
      } else if (Array.isArray(d.items)) {
        // starší záznam bez výběrů: stávající seznam se přenese do Výběr 1
        state.items = d.items.map(String);
        state.presets[0] = state.items.slice();
      }
      if (d.theme === 'dark' || d.theme === 'light') state.theme = d.theme;
      if (typeof d.allowRemove === 'boolean') state.allowRemove = d.allowRemove;
      if (typeof d.animate === 'boolean') state.animate = d.animate;
      if (typeof d.historyAsc === 'boolean') state.historyAsc = d.historyAsc;
      if (['wheel', 'roulette', 'cards'].includes(d.mode)) state.mode = d.mode;
      if (Array.isArray(d.history)) {
        // starší záznamy byly jen řetězce bez data
        state.history = d.history.slice(0, HISTORY_LIMIT).map((h) =>
          typeof h === 'object' && h !== null
            ? { text: String(h.text), ts: Number(h.ts) || null }
            : { text: String(h), ts: null });
      }
    } catch (e) { /* poškozená data ignorovat */ }
  }
  function save() {
    try {
      state.presets[state.active] = state.items.slice();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        // items zůstává jako kopie aktivního výběru kvůli zpětné kompatibilitě
        items: state.items, presets: state.presets, activePreset: state.active,
        presetNames: state.names,
        theme: state.theme, history: state.history,
        allowRemove: state.allowRemove, animate: state.animate,
        historyAsc: state.historyAsc, mode: state.mode
      }));
    } catch (e) { /* plné úložiště / privátní režim */ }
  }

  /* ---------- téma ---------- */
  function applyTheme() {
    const theme = state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    $('themeBtn').textContent = theme === 'dark' ? '☀️ Světlý režim' : '🌙 Tmavý režim';
    draw();
  }
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    state.theme = cur === 'dark' ? 'light' : 'dark';
    save();
    applyTheme();
  });

  /* ---------- kreslení ---------- */
  const TAU = Math.PI * 2;
  function colorFor(i, n) {
    // střídání odstínů, sousední výseče se liší i na přechodu poslední → první
    const hue = (i * 360 / n) % 360;
    const dark = document.documentElement.dataset.theme === 'dark';
    return `hsl(${hue}, ${dark ? 55 : 70}%, ${dark ? 42 : 68}%)`;
  }

  function draw() {
    const size = canvas.width, c = size / 2, r = c - 6;
    ctx.clearRect(0, 0, size, size);
    const n = state.items.length;

    if (n === 0) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel');
      ctx.beginPath(); ctx.arc(c, c, r, 0, TAU); ctx.fill();
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted');
      ctx.font = '32px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Přidej položky', c, c);
      return;
    }

    const seg = TAU / n;
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(state.rotation);

    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, i * seg, (i + 1) * seg);
      ctx.closePath();
      ctx.fillStyle = colorFor(i, n);
      ctx.fill();
      if (n > 1) {
        ctx.strokeStyle = 'rgba(0,0,0,.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // text podél poloměru
      ctx.save();
      ctx.rotate(i * seg + seg / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      const fontSize = Math.max(14, Math.min(34, (r * seg) * 0.45, 34));
      ctx.font = `${fontSize}px system-ui, "Segoe UI", sans-serif`;
      ctx.fillStyle = document.documentElement.dataset.theme === 'dark' ? '#fff' : '#111';
      const maxW = r * 0.62;
      ctx.fillText(fit(state.items[i], maxW), r - 22, 0);
      ctx.restore();
    }
    ctx.restore();

    // okraj
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 4; ctx.stroke();
  }

  function fit(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  /* ---------- točení ---------- */
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 4); }

  function spin() {
    const n = state.items.length;
    if (state.spinning || n < 2) return;
    state.spinning = true;
    spinBtn.disabled = true;
    hub.classList.add('hidden');

    const seg = TAU / n;
    const winner = Math.floor(Math.random() * n);
    if (state.mode === 'roulette') { spinRoulette(winner); return; }
    if (state.mode === 'cards') { spinCards(winner); return; }
    // ukazatel je na úhlu 0 (vpravo); střed výseče vítěze + náhodný posun uvnitř výseče
    const jitter = (Math.random() - 0.5) * seg * 0.8;
    const targetMod = (TAU - ((winner + 0.5) * seg + jitter)) % TAU;
    const startMod = ((state.rotation % TAU) + TAU) % TAU;
    const fullTurns = 5 + Math.floor(Math.random() * 3);
    let delta = targetMod - startMod;
    if (delta < 0) delta += TAU;
    delta += fullTurns * TAU;

    if (!state.animate) {
      // bez animace: kolo se rovnou nastaví na vítěze a ukáže se výsledek
      state.rotation = (state.rotation + delta) % TAU;
      draw();
      state.spinning = false;
      spinBtn.disabled = false;
      showResult(winner);
      return;
    }

    const start = state.rotation, duration = 5000 + Math.random() * 1500;
    const t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      state.rotation = start + delta * easeOutCubic(t);
      draw();
      if (t < 1) return requestAnimationFrame(frame);
      state.rotation %= TAU;
      state.spinning = false;
      spinBtn.disabled = false;
      showResult(winner);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- výsledek / modal ---------- */
  let lastWinner = -1;
  function showResult(index) {
    lastWinner = index;
    const text = state.items[index];
    $('modalResult').textContent = text;
    $('modalResult').style.borderLeftColor = colorFor(index, state.items.length);
    state.history.unshift({ text, ts: Date.now() });
    state.history = state.history.slice(0, HISTORY_LIMIT);
    save();
    renderHistory();
    $('modalRemove').hidden = !state.allowRemove;
    modal.showModal();
    $('modalClose').focus();
  }

  $('allowRemove').addEventListener('change', (e) => {
    state.allowRemove = e.target.checked;
    save();
  });
  $('animate').addEventListener('change', (e) => {
    state.animate = e.target.checked;
    save();
  });
  $('modalClose').addEventListener('click', () => modal.close());
  $('modalRemove').addEventListener('click', () => {
    if (lastWinner >= 0) {
      state.items.splice(lastWinner, 1);
      lastWinner = -1;
      syncTextarea();
      onItemsChanged(false);
    }
    modal.close();
  });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
  modal.addEventListener('close', () => hub.classList.remove('hidden'));

  /* ---------- UI ---------- */
  function syncTextarea() { textarea.value = state.items.join('\n'); }

  function onItemsChanged(fromTextarea = true) {
    $('count').textContent = `Položek: ${state.items.length}`;
    spinBtn.disabled = state.spinning || state.items.length < 2;
    save();
    draw();
  }

  textarea.addEventListener('input', () => {
    state.items = textarea.value.split('\n').map((s) => s.trim()).filter(Boolean);
    onItemsChanged();
  });

  function setItems(items) {
    if (state.spinning) return;
    state.items = items.slice();
    syncTextarea();
    onItemsChanged(false);
  }

  /* ---------- výběry (3 sloty se seznamy) ---------- */
  function renderPresetTabs() {
    const box = $('presetTabs');
    box.innerHTML = '';
    state.presets.forEach((_, i) => {
      if (i === renamingIdx) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'preset-name';
        input.maxLength = PRESET_NAME_MAX;
        input.value = presetLabel(i);
        input.setAttribute('aria-label', 'Název výběru');
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') finishRename(i, input.value, true);
          else if (e.key === 'Escape') finishRename(i, '', false);
        });
        input.addEventListener('blur', () => finishRename(i, input.value, true));
        box.appendChild(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);
        return;
      }
      const b = document.createElement('button');
      const on = i === state.active;
      b.type = 'button';
      b.className = 'seg-btn' + (on ? ' active' : '');
      b.textContent = presetLabel(i);
      b.title = 'Přepne na seznam „' + presetLabel(i) + '“ (dvojklikem přejmenuješ)';
      b.setAttribute('aria-pressed', String(on));
      b.addEventListener('click', () => switchPreset(i));
      b.addEventListener('dblclick', () => { switchPreset(i); startRename(i); });
      box.appendChild(b);
    });
    const rename = document.createElement('button');
    rename.type = 'button';
    rename.className = 'seg-btn seg-action';
    rename.textContent = '✎';
    rename.title = 'Přejmenuje aktuální výběr';
    rename.addEventListener('click', () => startRename(state.active));
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'seg-btn seg-action';
    add.textContent = '+';
    add.title = 'Přidá nový prázdný výběr (nejvýše ' + MAX_PRESETS + ')';
    add.disabled = state.presets.length >= MAX_PRESETS;
    add.addEventListener('click', addPreset);
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'seg-btn seg-action';
    del.textContent = '✕';
    del.title = 'Odebere aktuální výběr i s jeho položkami (Výběr 1 odebrat nejde)';
    del.addEventListener('click', removePreset);
    box.appendChild(add);
    box.appendChild(rename);
    if (state.active > 0) box.appendChild(del);   // první (výchozí) výběr odebrat nejde
  }

  // vlastní název výběru; prázdný = výchozí „Výběr N“
  const PRESET_NAME_MAX = 20;
  let renamingIdx = null;
  const presetLabel = (i) => state.names[i] || 'Výběr ' + (i + 1);

  function startRename(i) {
    if (state.spinning) return;
    renamingIdx = i;
    renderPresetTabs();
  }

  function finishRename(i, value, commit) {
    if (renamingIdx !== i) return;   // blur po Enteru/Escape
    renamingIdx = null;
    if (commit) {
      state.names[i] = value.trim().slice(0, PRESET_NAME_MAX).trim();
      save();
    }
    renderPresetTabs();
  }

  function addPreset() {
    if (state.spinning || state.presets.length >= MAX_PRESETS) return;
    state.presets[state.active] = state.items.slice();
    state.presets.push([]);
    state.names.push('');
    switchPreset(state.presets.length - 1);
  }

  function removePreset() {
    // první (výchozí) výběr se odebrat nedá
    if (state.spinning || state.active === 0 || state.presets.length <= 1) return;
    const i = state.active;
    const doRemove = () => {
      state.presets.splice(i, 1);
      state.names.splice(i, 1);
      renamingIdx = null;
      state.active = Math.min(i, state.presets.length - 1);
      state.items = state.presets[state.active].slice();
      syncTextarea();
      renderPresetTabs();
      onItemsChanged(false);
    };
    askConfirm(`Opravdu odebrat „${presetLabel(i)}“ i s jeho položkami?`, 'Odebrat', doRemove);
  }

  function switchPreset(i) {
    if (state.spinning || i === state.active) return;
    renamingIdx = null;
    state.presets[state.active] = state.items.slice();
    state.active = i;
    state.items = state.presets[i].slice();
    syncTextarea();
    renderPresetTabs();
    onItemsChanged(false);
  }

  function parseLines(text) {
    return text.replace(/^﻿/, '').split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  }

  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || state.spinning) return;
    const reader = new FileReader();
    reader.onload = () => setItems(parseLines(String(reader.result)));
    reader.readAsText(file, 'UTF-8');
  });

  $('exportBtn').addEventListener('click', () => {
    // BOM kvůli správnému zobrazení diakritiky v Poznámkovém bloku
    const blob = new Blob(['﻿' + state.items.join('\r\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kolo-stesti.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  const MODES = {
    wheel: { btn: 'modeWheel' },
    roulette: { btn: 'modeRoulette', caption: 'kliknutím vypustíš kuličku' },
    cards: { btn: 'modeCards', caption: 'kliknutím zamícháš balíček' }
  };

  function setMode(mode) {
    state.mode = MODES[mode] ? mode : 'wheel';
    Object.keys(MODES).forEach((m) => {
      const on = m === state.mode;
      $('stage').classList.toggle('mode-' + m, on);
      $(MODES[m].btn).classList.toggle('active', on);
      $(MODES[m].btn).setAttribute('aria-pressed', String(on));
    });
    if (MODES[state.mode].caption) $('caption').textContent = MODES[state.mode].caption;
    if (state.mode === 'roulette') startRoulette(); else stopRoulette();
  }
  Object.keys(MODES).forEach((m) => {
    $(MODES[m].btn).addEventListener('click', () => {
      if (state.spinning) return;
      setMode(m);
      save();
    });
  });
  $('rouletteFace').addEventListener('click', spin);
  $('cardsFace').addEventListener('click', spin);
  window.addEventListener('resize', fitCards);

  /* ---------- Ruleta (pohled shora) ---------- */
  const rCanvas = $('roulette'), rctx = rCanvas.getContext('2d');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const R_WHEEL_SPEED = 0.5;       // rad/s, kolo se točí pořád stejně
  const R_SPIN_MS = 6500;           // základní délka letu kuličky
  const R_BOWL = 392, R_WOOD = 335, R_TRACK = 300, R_RIM = 265;
  const R_POCKET_OUT = 262, R_POCKET_IN = 168, R_BALL_REST = 238;
  const roulette = { raf: 0, base: 0, t0: 0, ball: null, spin: null, onDone: null };

  function rouletteWheelAt(timeMs) {
    return roulette.base + R_WHEEL_SPEED * (timeMs - roulette.t0) / 1000;
  }

  function startRoulette() {
    if (roulette.raf) return;
    roulette.t0 = performance.now();
    const loop = (now) => {
      // chyba v jednom snímku nesmí zastavit smyčku a tím zaseknout losování
      try { drawRoulette(now); } catch (e) { console.error('ruleta: chyba při kreslení', e); }
      roulette.raf = requestAnimationFrame(loop);
    };
    roulette.raf = requestAnimationFrame(loop);
  }

  function stopRoulette() {
    if (!roulette.raf || roulette.spin) return;
    cancelAnimationFrame(roulette.raf);
    roulette.raf = 0;
    const now = performance.now();
    roulette.base = rouletteWheelAt(now);   // aby kolo po návratu navázalo
    roulette.t0 = now;
  }

  function rouletteFit(text, maxW) {
    if (rctx.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && rctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  function drawRoulette(now) {
    const size = rCanvas.width, c = size / 2;
    const items = state.items, n = items.length;
    const wheel = rouletteWheelAt(now);
    rctx.clearRect(0, 0, size, size);

    // dřevěná mísa
    let g = rctx.createRadialGradient(c, c, R_WOOD, c, c, R_BOWL);
    g.addColorStop(0, '#8b5a2b'); g.addColorStop(.6, '#5e3a1a'); g.addColorStop(1, '#3a210d');
    rctx.fillStyle = g;
    rctx.beginPath(); rctx.arc(c, c, R_BOWL, 0, TAU); rctx.fill();
    rctx.strokeStyle = '#d4af37'; rctx.lineWidth = 4;
    rctx.beginPath(); rctx.arc(c, c, R_WOOD, 0, TAU); rctx.stroke();

    // dráha kuličky
    g = rctx.createRadialGradient(c, c, R_RIM, c, c, R_WOOD);
    g.addColorStop(0, '#2b2b31'); g.addColorStop(.5, '#4d4d58'); g.addColorStop(1, '#25252b');
    rctx.fillStyle = g;
    rctx.beginPath(); rctx.arc(c, c, R_WOOD - 2, 0, TAU); rctx.fill();
    rctx.strokeStyle = '#d4af37'; rctx.lineWidth = 3;
    rctx.beginPath(); rctx.arc(c, c, R_RIM, 0, TAU); rctx.stroke();

    // přihrádky (točí se s kolem)
    if (n === 0) {
      rctx.fillStyle = '#16161a';
      rctx.beginPath(); rctx.arc(c, c, R_POCKET_OUT, 0, TAU); rctx.fill();
      rctx.fillStyle = '#ddd'; rctx.font = '34px system-ui'; rctx.textAlign = 'center';
      rctx.fillText('Přidej položky', c, c);
      return;
    }
    const seg = TAU / n;
    for (let i = 0; i < n; i++) {
      const a0 = wheel + i * seg, a1 = a0 + seg;
      rctx.beginPath();
      rctx.arc(c, c, R_POCKET_OUT, a0, a1);
      rctx.arc(c, c, R_POCKET_IN, a1, a0, true);
      rctx.closePath();
      rctx.fillStyle = i % 2 ? '#16161a' : '#c41e3a';
      rctx.fill();
      rctx.strokeStyle = '#d4af37'; rctx.lineWidth = 2; rctx.stroke();

      rctx.save();
      rctx.translate(c, c);
      rctx.rotate(a0 + seg / 2);
      rctx.textAlign = 'right'; rctx.textBaseline = 'middle';
      rctx.fillStyle = '#fff';
      rctx.font = `600 ${Math.max(11, Math.min(22, R_POCKET_IN * seg * 0.45))}px system-ui, "Segoe UI", sans-serif`;
      // nejdřív zmenšit písmo, až potom zkracovat text
      const maxW = R_POCKET_OUT - R_POCKET_IN - 16;
      let fs = Math.max(11, Math.min(20, R_POCKET_IN * seg * 0.45));
      rctx.font = `600 ${fs}px system-ui, "Segoe UI", sans-serif`;
      while (fs > 11 && rctx.measureText(items[i]).width > maxW) {
        fs -= 1;
        rctx.font = `600 ${fs}px system-ui, "Segoe UI", sans-serif`;
      }
      rctx.fillText(rouletteFit(items[i], maxW), R_POCKET_OUT - 8, 0);
      rctx.restore();
    }

    // kužel uprostřed a točící se hlavice
    g = rctx.createRadialGradient(c - 30, c - 30, 10, c, c, R_POCKET_IN);
    g.addColorStop(0, '#9a6a33'); g.addColorStop(1, '#2b1a0c');
    rctx.fillStyle = g;
    rctx.beginPath(); rctx.arc(c, c, R_POCKET_IN - 2, 0, TAU); rctx.fill();
    rctx.save();
    rctx.translate(c, c); rctx.rotate(wheel);
    rctx.strokeStyle = '#d4af37'; rctx.lineWidth = 7; rctx.lineCap = 'round';
    for (let k = 0; k < 4; k++) {
      rctx.rotate(Math.PI / 2);
      rctx.beginPath(); rctx.moveTo(18, 0); rctx.lineTo(112, 0); rctx.stroke();
      rctx.fillStyle = '#d4af37';
      rctx.beginPath(); rctx.arc(118, 0, 9, 0, TAU); rctx.fill();
    }
    rctx.restore();
    g = rctx.createRadialGradient(c - 8, c - 8, 2, c, c, 34);
    g.addColorStop(0, '#fff2b0'); g.addColorStop(1, '#a8841a');
    rctx.fillStyle = g;
    rctx.beginPath(); rctx.arc(c, c, 34, 0, TAU); rctx.fill();

    // kulička
    let ball = null;   // { a, r, k }
    const s = roulette.spin;
    if (s) {
      // časové razítko snímku může být o pár ms starší než s.t0, záporné p by shodilo kreslení
      const p = Math.max(0, (now - s.t0) / s.T);
      if (p >= 1) {
        roulette.ball = { pocket: s.winner, offset: s.offset };
        roulette.spin = null;
        const done = roulette.onDone;
        roulette.onDone = null;
        if (done) done();
      } else {
        // kulička běží proti směru kola a zpomaluje; cílový úhel = střed vítězné přihrádky
        const endAngle = rouletteWheelAt(s.t0 + s.T) + (s.winner + 0.5) * s.seg + s.offset;
        const a = endAngle + s.turns * TAU * Math.pow(1 - p, 2.2);
        let r = R_TRACK;
        if (p >= 0.55) {
          const q = (p - 0.55) / 0.45;
          const e = q * q * (3 - 2 * q);
          r = R_BALL_REST + (R_TRACK - R_BALL_REST) * (1 - e);
          if (q > 0.6) r += 16 * (1 - q) * Math.abs(Math.sin((q - 0.6) * Math.PI * 6));
        }
        ball = { a, r, k: Math.min(1, p / 0.04) };
      }
    }
    if (!ball && roulette.ball && roulette.ball.pocket < n) {
      ball = {
        a: wheel + (roulette.ball.pocket + 0.5) * seg + roulette.ball.offset,
        r: R_BALL_REST, k: 1
      };
    }
    if (ball) {
      const bx = c + Math.cos(ball.a) * ball.r, by = c + Math.sin(ball.a) * ball.r;
      const br = 13 * ball.k;
      rctx.fillStyle = 'rgba(0,0,0,.35)';
      rctx.beginPath(); rctx.arc(bx + 3, by + 4, br, 0, TAU); rctx.fill();
      g = rctx.createRadialGradient(bx - br * .35, by - br * .35, 1, bx, by, br);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#e6e6e6'); g.addColorStop(1, '#9a9a9a');
      rctx.fillStyle = g;
      rctx.beginPath(); rctx.arc(bx, by, br, 0, TAU); rctx.fill();
    }
  }

  function rouletteSpin(winner) {
    return new Promise((resolve) => {
      if (!state.animate) {
        roulette.ball = { pocket: winner, offset: 0 };
        return resolve();
      }
      startRoulette();
      const seg = TAU / state.items.length;
      roulette.ball = null;   // stará kulička zmizí, nová vyjede na dráhu
      roulette.onDone = resolve;
      roulette.spin = {
        t0: performance.now(), T: R_SPIN_MS + Math.random() * 1500,
        winner, seg, offset: (Math.random() - .5) * seg * .4,
        turns: 7 + Math.floor(Math.random() * 3)
      };
      // pojistka: kdyby se animace nedokončila (např. skrytá záložka), losování se dokončí samo
      const s = roulette.spin;
      setTimeout(() => {
        if (roulette.spin !== s) return;
        roulette.ball = { pocket: s.winner, offset: s.offset };
        roulette.spin = null;
        const done = roulette.onDone;
        roulette.onDone = null;
        if (done) done();
      }, s.T + 1500);
    });
  }

  async function spinRoulette(winner) {
    try {
      await rouletteSpin(winner);
      if (state.animate) await sleep(500);   // kulička chvíli „dosedá“ s kolem
    } finally {
      state.spinning = false;
      spinBtn.disabled = state.items.length < 2;
    }
    showResult(winner);
  }

  /* ---------- Tahání karet ---------- */
  const DECK_SIZE = 12;
  const deck = [];                 // { el, text } od spodní karty po vrchní
  let chosenCard = null;

  // všechny transformace mají stejný seznam funkcí, aby se animace správně interpolovaly
  function cardTransform({ x = 0, y = 0, r = 0, s = 1, f = 0 }) {
    return `translate(-50%, -50%) translate(${x}%, ${y}%) rotate(${r}deg) scale(${s}) rotateY(${f}deg)`;
  }
  const stackPose = (i) => ({ x: i * 0.35, y: -i * 0.5 });

  function buildDeck() {
    const box = $('deckBox');
    box.innerHTML = '';
    deck.length = 0;
    for (let i = 0; i < DECK_SIZE; i++) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="card-face card-back"><span>?</span></div>' +
        '<div class="card-face card-front"><span class="corner tl">♦</span>' +
        '<span class="card-text"></span><span class="corner br">♦</span></div>';
      el.style.transform = cardTransform(stackPose(i));
      el.style.zIndex = String(i);
      box.appendChild(el);
      deck.push({ el, text: el.querySelector('.card-text') });
    }
  }

  function fitCards() {
    $('cardsFace').style.setProperty('--cw', ($('stage').clientWidth * 0.26) + 'px');
  }

  function moveCard(card, pose, ms, delay = 0, easing = 'cubic-bezier(.4, 0, .2, 1)') {
    const to = cardTransform(pose);
    const anim = card.el.animate(
      [{ transform: card.el.style.transform }, { transform: to }],
      { duration: ms, delay, easing, fill: 'both' }
    );
    return anim.finished
      .then(() => { card.el.style.transform = to; anim.cancel(); })
      .catch(() => {});
  }

  function restackZ() { deck.forEach((c, i) => { c.el.style.zIndex = String(i); }); }

  function gatherDeck(ms) {
    return Promise.all(deck.map((c, i) => moveCard(c, stackPose(i), ms)));
  }

  // jedno „prolistování“: balíček se rozdělí na dvě hromádky a proloží se
  async function shuffleRound() {
    const half = Math.ceil(deck.length / 2);
    await Promise.all(deck.map((c, i) => {
      const left = i < half, j = left ? i : i - half;
      return moveCard(c, {
        x: (left ? -62 : 62) + j * 0.35, y: -j * 0.5, r: left ? -7 : 7
      }, 280);
    }));
    const a = deck.slice(0, half), b = deck.slice(half), merged = [];
    for (let k = 0; k < half; k++) {
      merged.push(a[k]);
      if (b[k]) merged.push(b[k]);
    }
    deck.splice(0, deck.length, ...merged);
    restackZ();
    await Promise.all(deck.map((c, i) => moveCard(c, stackPose(i), 240, i * 22)));
  }

  async function pickCard(text) {
    const idx = 3 + Math.floor(Math.random() * (deck.length - 6));   // z prostředku balíčku
    const card = deck[idx], base = stackPose(idx);
    card.text.textContent = text;
    card.el.style.zIndex = '100';
    await moveCard(card, { x: base.x + 78, y: base.y - 6, r: 9, s: 1.05 }, 380);
    await moveCard(card, { x: 0, y: 0, r: 0, s: 1.7, f: 180 }, 900, 0, 'cubic-bezier(.3, .1, .2, 1)');
    chosenCard = card;
  }

  async function spinCards(winner) {
    const text = state.items[winner];
    try {
      if (chosenCard) {            // karta z minulého losování zpět do balíčku
        await gatherDeck(380);
        chosenCard = null;
        restackZ();
      }
      if (state.animate) {
        for (let k = 0; k < 3; k++) await shuffleRound();
        await sleep(250);
        await pickCard(text);
        await sleep(700);
      } else {
        const card = deck[Math.floor(deck.length / 2)];
        card.text.textContent = text;
        card.el.style.zIndex = '100';
        card.el.style.transform = cardTransform({ s: 1.7, f: 180 });
        chosenCard = card;
      }
    } finally {
      state.spinning = false;
      spinBtn.disabled = state.items.length < 2;
    }
    showResult(winner);
  }

  /* ---------- výsuvný panel historie ---------- */
  const historyTab = $('historyTab');
  function setHistoryOpen(open) {
    document.body.classList.toggle('history-open', open);
    historyTab.setAttribute('aria-expanded', String(open));
    updateHistoryTab();
  }
  function updateHistoryTab() {
    const open = document.body.classList.contains('history-open');
    const n = state.history.length;
    historyTab.textContent = (open ? 'Skrýt historii' : 'Zobrazit historii') + (n ? ` (${n})` : '');
  }
  historyTab.addEventListener('click', () => {
    setHistoryOpen(!document.body.classList.contains('history-open'));
  });
  $('historyClose').addEventListener('click', () => setHistoryOpen(false));
  document.querySelectorAll('.th-sort').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.historyAsc = !state.historyAsc;
      save();
      renderHistory();
      $('historyScroll').scrollTop = 0;
    });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.querySelector('dialog[open]')) setHistoryOpen(false);
  });

  function renderHistory() {
    const list = $('historyList');
    list.innerHTML = '';
    $('historyScroll').hidden = state.history.length === 0;
    $('historyEmpty').hidden = state.history.length > 0;
    // pole je řazené od nejnovějšího; číslo 1 má vždy nejstarší záznam
    const rows = state.history.map((h, idx) => ({ h, n: state.history.length - idx }));
    if (state.historyAsc) rows.reverse();
    document.querySelectorAll('.th-sort .arrow').forEach((a) => {
      a.textContent = state.historyAsc ? '▲' : '▼';
    });
    rows.forEach(({ h, n }) => {
      const tr = document.createElement('tr');
      const what = document.createElement('td');
      what.className = 'what';
      what.textContent = h.text;
      const when = document.createElement('td');
      when.className = 'when';
      when.textContent = h.ts
        ? new Date(h.ts).toLocaleString('cs-CZ', {
            day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
          })
        : '';
      const num = document.createElement('td');
      num.className = 'num';
      num.textContent = String(n);
      tr.append(what, when, num);
      list.appendChild(tr);
    });
    updateHistoryTab();
  }

  $('spinBtn').addEventListener('click', spin);
  canvas.addEventListener('click', spin);

  /* ---------- potvrzovací modal ---------- */
  const confirmModal = $('confirmModal');
  let onConfirm = null;
  function askConfirm(message, yesLabel, callback) {
    $('confirmText').textContent = message;
    $('confirmYes').textContent = yesLabel;
    onConfirm = callback;
    confirmModal.showModal();
  }
  $('confirmNo').addEventListener('click', () => confirmModal.close());
  $('confirmYes').addEventListener('click', () => {
    const cb = onConfirm;
    onConfirm = null;
    confirmModal.close();
    if (cb) cb();
  });
  confirmModal.addEventListener('close', () => { onConfirm = null; });

  $('resetBtn').addEventListener('click', () => {
    if (state.spinning) return;
    askConfirm('Opravdu resetovat kolo a smazat historii výsledků?', 'Resetovat', () => {
      state.rotation = 0;
      state.history = [];
      renderHistory();
      save();
      draw();
    });
  });
  $('clearBtn').addEventListener('click', () => {
    if (state.spinning || state.items.length === 0) return;
    askConfirm('Opravdu vymazat všechny položky?', 'Vymazat', () => {
      setItems([]);
      textarea.focus();
    });
  });
  confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) confirmModal.close(); });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!state.theme) applyTheme();
  });

  /* ---------- start ---------- */
  load();
  $('allowRemove').checked = state.allowRemove;
  $('animate').checked = state.animate;
  renderPresetTabs();
  buildDeck();
  fitCards();
  setMode(state.mode);
  syncTextarea();
  renderHistory();
  applyTheme();
  onItemsChanged(false);
})();
</script>
<script src="dist/analytics.js" defer></script>
</body>
</html>
