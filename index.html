<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolo štěstí</title>
<style>
  :root {
    --bg: #e9ecf1;
    --panel: #f6f7fa;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #bcc2cd;
    --accent: #0d6efd;
    --accent-text: #ffffff;
    --danger: #e5566b;
    --chip-border: #6aa0f5;
    --chip-text: #2563c9;
    --shadow: 0 10px 40px rgba(0, 0, 0, .15);
    --drawer-bg: #dde1e8;
    --table-bg: var(--panel);
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --panel: #1e222b;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --border: #3a4050;
    --accent: #4c8dff;
    --accent-text: #ffffff;
    --danger: #e0556a;
    --chip-border: #4a6fb0;
    --chip-text: #8db4ff;
    --shadow: 0 10px 40px rgba(0, 0, 0, .6);
    --drawer-bg: var(--bg);
    --table-bg: var(--panel);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background .25s, color .25s;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; gap: 12px;
  }
  header h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 500; }
  .icon-btn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-size: .95rem; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 28px;
    max-width: 1200px; margin: 0 auto; padding: 8px 20px 40px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  /* wheel */
  .wheel-wrap {
    position: relative; width: 100%; max-width: 640px; margin: 0 auto;
    aspect-ratio: 1 / 1;
  }
  #wheel { width: 100%; height: 100%; display: block; cursor: pointer; border-radius: 50%; box-shadow: var(--shadow); }
  .pointer {
    position: absolute; right: -14px; top: 50%; transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    border-right: 34px solid #e11d2e;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));
    pointer-events: none;
  }
  .hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 22, 27, .7); color: #fff;
    padding: 12px 20px; border-radius: 10px; font-size: clamp(.95rem, 2.4vw, 1.4rem);
    pointer-events: none; white-space: nowrap;
    transition: opacity .3s;
  }
  .hub.hidden { opacity: 0; }

  /* side panel */
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    border: 0; border-radius: 6px; cursor: pointer; font-size: 1rem;
    padding: 10px 22px; color: #fff;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); font-size: 1.15rem; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger { background: var(--danger); padding: 6px 12px; font-size: .8rem; }
  .btn-ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 5px 14px; font-size: .85rem;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  textarea {
    width: 100%; height: 300px; resize: vertical;
    background: var(--panel); color: var(--text);
    border: 2px solid var(--border); border-radius: 4px;
    padding: 10px; font: inherit; line-height: 1.45;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .count { color: var(--muted); font-size: .85rem; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; width: 100%; }

  /* výsuvný panel s historií */
  :root { --drawer-w: min(380px, 92vw); --tab-w: 36px; }
  body { padding-right: var(--tab-w); transition: background .25s, color .25s, padding-right .35s ease; }
  body.history-open { padding-right: calc(var(--drawer-w) + var(--tab-w)); }
  @media (max-width: 1200px) {
    /* na užších obrazovkách panel překrývá obsah, nic se neposouvá */
    body.history-open { padding-right: var(--tab-w); }
  }
  .history-tab {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 31;
    width: var(--tab-w); padding: 18px 0;
    writing-mode: vertical-rl; text-align: center; white-space: nowrap;
    background: var(--panel); color: var(--text); font: inherit; font-size: .95rem;
    border: 1px solid var(--border); border-right: 0; border-radius: 10px 0 0 10px;
    cursor: pointer; box-shadow: var(--shadow);
    transition: right .35s ease, border-color .2s;
  }
  .history-tab:hover { border-color: var(--accent); }
  body.history-open .history-tab { right: var(--drawer-w); }
  .history-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
    width: var(--drawer-w);
    display: flex; flex-direction: column; gap: 10px; padding: 16px;
    background: var(--drawer-bg); border-left: 1px solid var(--border); box-shadow: var(--shadow);
    transform: translateX(100%); visibility: hidden;
    transition: transform .35s ease, visibility 0s .35s;
  }
  body.history-open .history-drawer {
    transform: none; visibility: visible;
    transition: transform .35s ease, visibility 0s;
  }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; }
  .drawer-head h3 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text); }
  .history { font-size: .85rem; color: var(--muted); }
  .history-empty { margin: 8px 0; }
  .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .switch {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px 6px 8px; font-size: .95rem; color: var(--text);
  }
  .switch:hover { border-color: var(--accent); }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: relative; width: 36px; height: 20px; border-radius: 999px;
    background: var(--border); transition: background .2s;
  }
  .switch .thumb {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .thumb { transform: translateX(16px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); cursor: pointer; user-select: none; }
  .opt input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .history-scroll {
    flex: 1; min-height: 0; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--table-bg);
  }
  .history table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .history th, .history td { padding: 6px 10px; text-align: left; vertical-align: baseline; }
  .history thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--table-bg); color: var(--text); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .history tbody tr + tr td { border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
  .history .what { overflow-wrap: anywhere; color: var(--text); }
  .th-sort {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: 0; padding: 0; margin: 0;
    color: inherit; font: inherit; cursor: pointer; white-space: nowrap;
  }
  .th-sort:hover, .th-sort:focus-visible { color: var(--accent); outline: none; }
  .th-sort .arrow { font-size: .7rem; }
  .history .num { width: 1%; text-align: right; white-space: nowrap; }
  .history .when { width: 1%; white-space: nowrap; font-size: .8rem; }

  /* modal */
  dialog {
    border: 0; border-radius: 14px; padding: 0;
    background: var(--panel); color: var(--text);
    box-shadow: var(--shadow); width: min(92vw, 440px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .55); backdrop-filter: blur(2px); }
  dialog[open] { animation: pop .3s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-body { padding: 28px 24px 12px; text-align: center; }
  .modal-body small { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .modal-result {
    margin: 10px 0 0; font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 700;
    word-break: break-word; padding: 14px; border-radius: 10px;
    border-left: 10px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .modal-actions { display: flex; gap: 10px; justify-content: center; padding: 16px 24px 24px; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <h1>Kolo štěstí</h1>
  <div class="header-actions">
    <label class="switch" title="Zapnout/vypnout animaci točení kola">
      <input id="animate" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
      <span class="switch-label">Animace</span>
    </label>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Přepnout světlý/tmavý režim" title="Přepne mezi světlým a tmavým režimem">🌙 Tmavý režim</button>
  </div>
</header>

<main>
  <section class="wheel-wrap">
    <canvas id="wheel" width="800" height="800" aria-label="Kolo štěstí" title="Kliknutím roztočíš kolo"></canvas>
    <div class="pointer"></div>
    <div class="hub" id="hub">kliknutím to roztočíš</div>
  </section>

  <aside class="panel">
    <div class="actions">
      <button id="spinBtn" class="btn btn-primary" type="button" title="Roztočí kolo a vybere náhodnou položku (jsou potřeba aspoň 2)">Spustit</button>
      <button id="resetBtn" class="btn btn-danger" type="button" title="Vrátí kolo do výchozí polohy a smaže historii výsledků, položky zůstanou (před resetem se zeptá)">Resetovat</button>
    </div>

    <textarea id="items" spellcheck="false" aria-label="Položky kola, jedna na řádek"></textarea>
    <div class="row">
      <button id="clearBtn" class="btn btn-ghost" type="button" title="Smaže všechny položky z kola (před smazáním se zeptá)">Vymazat</button>
      <span class="count" id="count"></span>    </div>

    <div class="row">
      <button id="importBtn" class="btn btn-ghost" type="button" title="Načte položky z .txt souboru (jeden řádek = jedna položka) a nahradí aktuální seznam">⬆ Import .txt</button>
      <button id="exportBtn" class="btn btn-ghost" type="button" title="Uloží aktuální položky do .txt souboru (jeden řádek = jedna položka)">⬇ Export .txt</button>
    </div>
    <input id="importFile" type="file" accept=".txt,text/plain" hidden>

    <label class="opt" title="Když je zapnuto, ve výsledku se ukáže tlačítko, které vybranou položku odebere z kola">
      <input id="allowRemove" type="checkbox">
      Nabízet „Odebrat z kola“ ve výsledku
    </label>

  </aside>
</main>

<button id="historyTab" class="history-tab" type="button" aria-expanded="false" aria-controls="history"
        title="Zobrazí nebo skryje historii točení">Zobrazit historii</button>

<aside class="history-drawer history" id="history" aria-label="Historie točení">
  <div class="drawer-head">
    <h3>Historie točení</h3>
    <button id="historyClose" class="btn btn-ghost" type="button" title="Skrýt historii">✕</button>
  </div>
  <p class="history-empty" id="historyEmpty">Zatím žádné točení.</p>
  <div class="history-scroll" id="historyScroll" hidden>
    <table>
      <thead>
        <tr><th>Výsledek</th><th class="when"><button class="th-sort" type="button" title="Změnit řazení podle data">Datum a čas <span class="arrow" aria-hidden="true">▼</span></button></th>
          <th class="num"><button class="th-sort" type="button" title="Změnit řazení podle data"># <span class="arrow" aria-hidden="true">▼</span></button></th></tr>
      </thead>
      <tbody id="historyList"></tbody>
    </table>
  </div>
</aside>

<dialog id="modal">
  <div class="modal-body">
    <small>Vybráno</small>
    <p class="modal-result" id="modalResult"></p>
  </div>
  <div class="modal-actions">
    <button id="modalRemove" class="btn btn-ghost" type="button" title="Odebere vybranou položku ze seznamu, aby se už nemohla vylosovat znovu">Odebrat z kola</button>
    <button id="modalClose" class="btn btn-primary" type="button" autofocus>Zavřít</button>
  </div>
</dialog>

<dialog id="confirmModal">
  <div class="modal-body">
    <small>Potvrzení</small>
    <p class="modal-result" id="confirmText"></p>
  </div>
  <div class="modal-actions">
    <button id="confirmNo" class="btn btn-ghost" type="button">Zrušit</button>
    <button id="confirmYes" class="btn btn-danger" type="button">Vymazat</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'kolo-stesti:v1';
  const HISTORY_LIMIT = 100;

  const $ = (id) => document.getElementById(id);
  const canvas = $('wheel'), ctx = canvas.getContext('2d');
  const textarea = $('items'), hub = $('hub'), spinBtn = $('spinBtn');
  const modal = $('modal');

  const state = {
    items: [],
    theme: null,
    rotation: 0,       // rad
    spinning: false,
    history: [],
    allowRemove: false,
    animate: true,
    historyAsc: false   // false = nejnovější nahoře
  };

  /* ---------- localStorage ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (Array.isArray(d.items)) state.items = d.items.map(String);
      if (d.theme === 'dark' || d.theme === 'light') state.theme = d.theme;
      if (typeof d.allowRemove === 'boolean') state.allowRemove = d.allowRemove;
      if (typeof d.animate === 'boolean') state.animate = d.animate;
      if (typeof d.historyAsc === 'boolean') state.historyAsc = d.historyAsc;
      if (Array.isArray(d.history)) {
        // starší záznamy byly jen řetězce bez data
        state.history = d.history.slice(0, HISTORY_LIMIT).map((h) =>
          typeof h === 'object' && h !== null
            ? { text: String(h.text), ts: Number(h.ts) || null }
            : { text: String(h), ts: null });
      }
    } catch (e) { /* poškozená data ignorovat */ }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        items: state.items, theme: state.theme, history: state.history,
        allowRemove: state.allowRemove, animate: state.animate,
        historyAsc: state.historyAsc
      }));
    } catch (e) { /* plné úložiště / privátní režim */ }
  }

  /* ---------- téma ---------- */
  function applyTheme() {
    const theme = state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    $('themeBtn').textContent = theme === 'dark' ? '☀️ Světlý režim' : '🌙 Tmavý režim';
    draw();
  }
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    state.theme = cur === 'dark' ? 'light' : 'dark';
    save();
    applyTheme();
  });

  /* ---------- kreslení ---------- */
  const TAU = Math.PI * 2;
  function colorFor(i, n) {
    // střídání odstínů, sousední výseče se liší i na přechodu poslední → první
    const hue = (i * 360 / n) % 360;
    const dark = document.documentElement.dataset.theme === 'dark';
    return `hsl(${hue}, ${dark ? 55 : 70}%, ${dark ? 42 : 68}%)`;
  }

  function draw() {
    const size = canvas.width, c = size / 2, r = c - 6;
    ctx.clearRect(0, 0, size, size);
    const n = state.items.length;

    if (n === 0) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel');
      ctx.beginPath(); ctx.arc(c, c, r, 0, TAU); ctx.fill();
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted');
      ctx.font = '32px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Přidej položky', c, c);
      return;
    }

    const seg = TAU / n;
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(state.rotation);

    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, i * seg, (i + 1) * seg);
      ctx.closePath();
      ctx.fillStyle = colorFor(i, n);
      ctx.fill();
      if (n > 1) {
        ctx.strokeStyle = 'rgba(0,0,0,.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // text podél poloměru
      ctx.save();
      ctx.rotate(i * seg + seg / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      const fontSize = Math.max(14, Math.min(34, (r * seg) * 0.45, 34));
      ctx.font = `${fontSize}px system-ui, "Segoe UI", sans-serif`;
      ctx.fillStyle = document.documentElement.dataset.theme === 'dark' ? '#fff' : '#111';
      const maxW = r * 0.62;
      ctx.fillText(fit(state.items[i], maxW), r - 22, 0);
      ctx.restore();
    }
    ctx.restore();

    // okraj
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 4; ctx.stroke();
  }

  function fit(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  /* ---------- točení ---------- */
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 4); }

  function spin() {
    const n = state.items.length;
    if (state.spinning || n < 2) return;
    state.spinning = true;
    spinBtn.disabled = true;
    hub.classList.add('hidden');

    const seg = TAU / n;
    const winner = Math.floor(Math.random() * n);
    // ukazatel je na úhlu 0 (vpravo); střed výseče vítěze + náhodný posun uvnitř výseče
    const jitter = (Math.random() - 0.5) * seg * 0.8;
    const targetMod = (TAU - ((winner + 0.5) * seg + jitter)) % TAU;
    const startMod = ((state.rotation % TAU) + TAU) % TAU;
    const fullTurns = 5 + Math.floor(Math.random() * 3);
    let delta = targetMod - startMod;
    if (delta < 0) delta += TAU;
    delta += fullTurns * TAU;

    if (!state.animate) {
      // bez animace: kolo se rovnou nastaví na vítěze a ukáže se výsledek
      state.rotation = (state.rotation + delta) % TAU;
      draw();
      state.spinning = false;
      spinBtn.disabled = false;
      showResult(winner);
      return;
    }

    const start = state.rotation, duration = 5000 + Math.random() * 1500;
    const t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      state.rotation = start + delta * easeOutCubic(t);
      draw();
      if (t < 1) return requestAnimationFrame(frame);
      state.rotation %= TAU;
      state.spinning = false;
      spinBtn.disabled = false;
      showResult(winner);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- výsledek / modal ---------- */
  let lastWinner = -1;
  function showResult(index) {
    lastWinner = index;
    const text = state.items[index];
    $('modalResult').textContent = text;
    $('modalResult').style.borderLeftColor = colorFor(index, state.items.length);
    state.history.unshift({ text, ts: Date.now() });
    state.history = state.history.slice(0, HISTORY_LIMIT);
    save();
    renderHistory();
    $('modalRemove').hidden = !state.allowRemove;
    modal.showModal();
    $('modalClose').focus();
  }

  $('allowRemove').addEventListener('change', (e) => {
    state.allowRemove = e.target.checked;
    save();
  });
  $('animate').addEventListener('change', (e) => {
    state.animate = e.target.checked;
    save();
  });
  $('modalClose').addEventListener('click', () => modal.close());
  $('modalRemove').addEventListener('click', () => {
    if (lastWinner >= 0) {
      state.items.splice(lastWinner, 1);
      lastWinner = -1;
      syncTextarea();
      onItemsChanged(false);
    }
    modal.close();
  });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
  modal.addEventListener('close', () => hub.classList.remove('hidden'));

  /* ---------- UI ---------- */
  function syncTextarea() { textarea.value = state.items.join('\n'); }

  function onItemsChanged(fromTextarea = true) {
    $('count').textContent = `Položek: ${state.items.length}`;
    spinBtn.disabled = state.spinning || state.items.length < 2;
    save();
    draw();
  }

  textarea.addEventListener('input', () => {
    state.items = textarea.value.split('\n').map((s) => s.trim()).filter(Boolean);
    onItemsChanged();
  });

  function setItems(items) {
    if (state.spinning) return;
    state.items = items.slice();
    syncTextarea();
    onItemsChanged(false);
  }

  function parseLines(text) {
    return text.replace(/^﻿/, '').split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  }

  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || state.spinning) return;
    const reader = new FileReader();
    reader.onload = () => setItems(parseLines(String(reader.result)));
    reader.readAsText(file, 'UTF-8');
  });

  $('exportBtn').addEventListener('click', () => {
    // BOM kvůli správnému zobrazení diakritiky v Poznámkovém bloku
    const blob = new Blob(['﻿' + state.items.join('\r\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kolo-stesti.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  /* ---------- výsuvný panel historie ---------- */
  const historyTab = $('historyTab');
  function setHistoryOpen(open) {
    document.body.classList.toggle('history-open', open);
    historyTab.setAttribute('aria-expanded', String(open));
    updateHistoryTab();
  }
  function updateHistoryTab() {
    const open = document.body.classList.contains('history-open');
    const n = state.history.length;
    historyTab.textContent = (open ? 'Skrýt historii' : 'Zobrazit historii') + (n ? ` (${n})` : '');
  }
  historyTab.addEventListener('click', () => {
    setHistoryOpen(!document.body.classList.contains('history-open'));
  });
  $('historyClose').addEventListener('click', () => setHistoryOpen(false));
  document.querySelectorAll('.th-sort').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.historyAsc = !state.historyAsc;
      save();
      renderHistory();
      $('historyScroll').scrollTop = 0;
    });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.querySelector('dialog[open]')) setHistoryOpen(false);
  });

  function renderHistory() {
    const list = $('historyList');
    list.innerHTML = '';
    $('historyScroll').hidden = state.history.length === 0;
    $('historyEmpty').hidden = state.history.length > 0;
    // pole je řazené od nejnovějšího; číslo 1 má vždy nejstarší záznam
    const rows = state.history.map((h, idx) => ({ h, n: state.history.length - idx }));
    if (state.historyAsc) rows.reverse();
    document.querySelectorAll('.th-sort .arrow').forEach((a) => {
      a.textContent = state.historyAsc ? '▲' : '▼';
    });
    rows.forEach(({ h, n }) => {
      const tr = document.createElement('tr');
      const what = document.createElement('td');
      what.className = 'what';
      what.textContent = h.text;
      const when = document.createElement('td');
      when.className = 'when';
      when.textContent = h.ts
        ? new Date(h.ts).toLocaleString('cs-CZ', {
            day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
          })
        : '';
      const num = document.createElement('td');
      num.className = 'num';
      num.textContent = String(n);
      tr.append(what, when, num);
      list.appendChild(tr);
    });
    updateHistoryTab();
  }

  $('spinBtn').addEventListener('click', spin);
  canvas.addEventListener('click', spin);

  /* ---------- potvrzovací modal ---------- */
  const confirmModal = $('confirmModal');
  let onConfirm = null;
  function askConfirm(message, yesLabel, callback) {
    $('confirmText').textContent = message;
    $('confirmYes').textContent = yesLabel;
    onConfirm = callback;
    confirmModal.showModal();
  }
  $('confirmNo').addEventListener('click', () => confirmModal.close());
  $('confirmYes').addEventListener('click', () => {
    const cb = onConfirm;
    onConfirm = null;
    confirmModal.close();
    if (cb) cb();
  });
  confirmModal.addEventListener('close', () => { onConfirm = null; });

  $('resetBtn').addEventListener('click', () => {
    if (state.spinning) return;
    askConfirm('Opravdu resetovat kolo a smazat historii výsledků?', 'Resetovat', () => {
      state.rotation = 0;
      state.history = [];
      renderHistory();
      save();
      draw();
    });
  });
  $('clearBtn').addEventListener('click', () => {
    if (state.spinning || state.items.length === 0) return;
    askConfirm('Opravdu vymazat všechny položky?', 'Vymazat', () => {
      setItems([]);
      textarea.focus();
    });
  });
  confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) confirmModal.close(); });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!state.theme) applyTheme();
  });

  /* ---------- start ---------- */
  load();
  $('allowRemove').checked = state.allowRemove;
  $('animate').checked = state.animate;
  syncTextarea();
  renderHistory();
  applyTheme();
  onItemsChanged(false);
})();
</script>
</body>
</html>
